# Goal - to check whether the application code coverage doesn't have security threats/issues

name: Sonar Qube Scan

on:
    workflow_call:
      inputs:
        # 1. Accepting the URL as an input prevents GitHub from stripping it due to scope rules
        SONAR_HOST_URL:
          required: true
          type: string
      secrets:
        # Keep the token as a secret for security
        SONAR_TOKEN:
          required: true

jobs:
    sonar-scanner:
        runs-on: ubuntu-latest
        steps:
            - name: Code Checkout
              uses: actions/checkout@v4
              with:
                fetch-depth: 0
             
            - name: Verify Secret Presence
              run: |
                if [ -z "${{ secrets.SONAR_TOKEN }}" ]; then
                  echo "❌ ERROR: SONAR_TOKEN is empty!"
                  exit 1
                fi
                if [ -z "${{ inputs.SONAR_HOST_URL }}" ]; then
                  echo "❌ ERROR: SONAR_HOST_URL is empty!"
                  exit 1
                fi
                echo "✅ Required configuration properties found."
                
            - name: SonarQube Scan
              uses: SonarSource/sonarqube-scan-action@v5
              with:
                args: >
                  -Dsonar.projectKey=devboard
              env:
                SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
                # 2. Feed the input URL directly into the scanner environment
                SONAR_HOST_URL: ${{ inputs.SONAR_HOST_URL }}
