# Goal - to check whether the application code has security threats/issues using GitHub CodeQL

name: Security Scan (CodeQL)

on:
    workflow_call:

jobs:
    analyze:
        name: CodeQL Analyze
        runs-on: ubuntu-latest
        permissions:
          # Required to write security alerts back to the repository's Security tab
          security-events: write
          actions: read
          contents: read

        steps:
            - name: Code Checkout
              uses: actions/checkout@v4
              with:
                fetch-depth: 0

            # Step 1: Initialize the CodeQL tools and define target languages
            - name: Initialize CodeQL
              uses: github/codeql-action/init@v3
              with:
                # Options include: javascript-typescript, python, go, java-kotlin, csharp, cpp, ruby
                languages: javascript-typescript 

            # Step 2: Automatically attempt to build compiled languages (if applicable)
            # For JavaScript/Python/Ruby, this step can safely remain but does nothing.
            - name: Autobuild
              uses: github/codeql-action/autobuild@v3

            # Step 3: Run the deep security analysis
            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@v3
              with:
                category: "/language:javascript-typescript"
